# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/agentstudio/webserver.pid;
error_log /var/log/sdkwork/agentstudio/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 443 ssl;
        listen 80;
        server_name agentstudio.sdkwork.com agentstudio-app.sdkwork.com agentstudio-admin.sdkwork.com;
        include snippets/gateway-api-locations.production.conf;
        ssl_certificate /etc/sdkwork/certs/letsencrypt/sdkwork.com/fullchain.pem;
        ssl_certificate_key /etc/sdkwork/certs/letsencrypt/sdkwork.com/privkey.pem;
        ssl_trusted_certificate /etc/sdkwork/certs/letsencrypt/sdkwork.com/chain.pem;
        ssl_stapling on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        location / {
            root /usr/share/sdkwork/agentstudio/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
    server {
